services:

  postgres:
    image: postgres:17-alpine
    container_name: ablespace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ablespace
      POSTGRES_PASSWORD: ablespace_password
      POSTGRES_DB: ablespace

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ablespace -d ablespace",
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: ablespace-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://ablespace:ablespace_password@postgres:5432/ablespace

      JWT_SECRET: ${JWT_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      GOOGLE_CALLBACK_URL: http://localhost:4000/auth/google/callback

    ports:
      - "4000:4000"

    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    container_name: ablespace-web
    restart: unless-stopped

    depends_on:
      - api

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000

    ports:
      - "3000:3000"


volumes:
  postgres_data: